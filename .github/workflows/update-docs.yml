name: Update sovereign cloud docs

on:
  schedule:
    # Mondays at 06:00 Paris time (CET in winter, CEST in summer).
    - cron: "0 6 * * 1"
      timezone: "Europe/Paris"
  # Run it by hand from the Actions tab to refresh the docs before Monday.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: update-sovereign-cloud-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Compile and smoke-test Python scripts
        run: |
          python3 -m py_compile scripts/scrape-gcd-docs.py scripts/sync-skill.py
          python3 -c "import importlib.util, json, pathlib; spec = importlib.util.spec_from_file_location('s', 'scripts/scrape-gcd-docs.py'); m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m); data = json.loads(pathlib.Path('docs-raw-s3ns/_secnumcloud_status.json').read_text()); prods, probes = m.discover_products_from_secnumcloud(data); assert len(prods) > 20 and len(probes) > 10"

      - name: Verify skill and reference files are in sync
        run: python3 -u scripts/sync-skill.py --check

  scrape:
    needs: validate
    # The pull request targets main, so only build it from main. A scheduled run
    # always does; a manual run started on another branch skips this job.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Credentials stay persisted here: the last step pushes the update branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true  # zizmor: ignore[artipacked]

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Save previous manifests and update trackers
        run: |
          cp docs-raw/_last_updated.json /tmp/previous_tracker_berlin.json 2>/dev/null || echo "{}" > /tmp/previous_tracker_berlin.json
          cp docs-raw-s3ns/_last_updated.json /tmp/previous_tracker_s3ns.json 2>/dev/null || echo "{}" > /tmp/previous_tracker_s3ns.json
          cp docs-raw/_manifest.json /tmp/previous_manifest_berlin.json 2>/dev/null || echo "{}" > /tmp/previous_manifest_berlin.json
          cp docs-raw-s3ns/_manifest.json /tmp/previous_manifest_s3ns.json 2>/dev/null || echo "{}" > /tmp/previous_manifest_s3ns.json
          cp docs-raw-s3ns/_secnumcloud_status.json /tmp/previous_secnumcloud_s3ns.json 2>/dev/null || echo "{}" > /tmp/previous_secnumcloud_s3ns.json

      - name: Scrape S3NS (Cloud de Confiance) docs and PREMI3NS SecNumCloud status
        id: scrape_s3ns
        continue-on-error: true
        run: python3 -u scripts/scrape-gcd-docs.py --region s3ns

      - name: Scrape Berlin (GCD) docs
        id: scrape_berlin
        continue-on-error: true
        run: python3 -u scripts/scrape-gcd-docs.py --region berlin

      - name: Verify at least one region scrape succeeded
        run: |
          if [ "${{ steps.scrape_berlin.outcome }}" = "failure" ] && [ "${{ steps.scrape_s3ns.outcome }}" = "failure" ]; then
            echo "ERROR: Both Berlin and S3NS scrapes failed." >&2
            exit 1
          fi

      - name: Synchronize skill capabilities and references
        run: |
          python3 -u scripts/sync-skill.py
          python3 -u scripts/sync-skill.py --check

      # CI runs on a pull request opened with GITHUB_TOKEN wait for approval, so the
      # scraped content is checked here, before it is committed.
      - name: Check skill integrity before committing
        run: python3 scripts/check-skill.py

      - name: Detect documentation and skill changes
        id: diff
        run: |
          CHANGED=false
          if ! diff -q /tmp/previous_tracker_berlin.json docs-raw/_last_updated.json > /dev/null 2>&1; then
            CHANGED=true
            echo "Berlin last-updated tracker changes detected:"
            diff -u /tmp/previous_tracker_berlin.json docs-raw/_last_updated.json || true
          fi
          if ! diff -q /tmp/previous_tracker_s3ns.json docs-raw-s3ns/_last_updated.json > /dev/null 2>&1; then
            CHANGED=true
            echo "S3NS last-updated tracker changes detected:"
            diff -u /tmp/previous_tracker_s3ns.json docs-raw-s3ns/_last_updated.json || true
          fi
          if ! diff -q /tmp/previous_secnumcloud_s3ns.json docs-raw-s3ns/_secnumcloud_status.json > /dev/null 2>&1; then
            CHANGED=true
            echo "S3NS SecNumCloud 3.2 qualification status changes detected:"
            diff -u /tmp/previous_secnumcloud_s3ns.json docs-raw-s3ns/_secnumcloud_status.json || true
          fi
          if [ -n "$(git status --porcelain docs-raw/ docs-raw-s3ns/ references/ SKILL.md README.md)" ]; then
            CHANGED=true
            echo "Repository file changes detected:"
            git status --short docs-raw/ docs-raw-s3ns/ references/ SKILL.md README.md
          fi
          if [ "$CHANGED" = "false" ]; then
            echo "No documentation or skill changes detected in either region."
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      # The update goes through a pull request so that a person reviews scraped web
      # text before it reaches the skill agents load. The branch is rebuilt from main
      # on every run, so one open pull request always holds the latest scrape.
      - name: Open or update the docs update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/docs-update
          BASE_BRANCH: ${{ github.ref_name }}
          TRIGGER: ${{ github.event_name }}
          S3NS_OUTCOME: ${{ steps.scrape_s3ns.outcome }}
          BERLIN_OUTCOME: ${{ steps.scrape_berlin.outcome }}
        run: |
          today="$(date -u +%Y-%m-%d)"
          title="chore: update scraped GCD/S3NS docs and sync skill ($today)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -C "$UPDATE_BRANCH"
          git add docs-raw/ docs-raw-s3ns/ references/ SKILL.md README.md
          git commit -m "$title"
          git push --force origin "$UPDATE_BRANCH"

          {
            echo "Scraped on $today (trigger: \`$TRIGGER\`)."
            echo
            echo "| Region | Scrape |"
            echo "|---|---|"
            echo "| S3NS | \`$S3NS_OUTCOME\` |"
            echo "| Berlin | \`$BERLIN_OUTCOME\` |"
            if [ "$S3NS_OUTCOME" != "success" ] || [ "$BERLIN_OUTCOME" != "success" ]; then
              echo
              echo "**Warning:** one region's scrape failed, so this update contains only the other region's changes."
            fi
            echo
            echo "Files agents load:"
            echo '```'
            git diff --stat HEAD~1 -- SKILL.md references/
            echo '```'
            echo
            pages="$(git diff --shortstat HEAD~1 -- docs-raw/ docs-raw-s3ns/ | sed 's/^ *//')"
            echo "Scraped pages: ${pages:-no changes}."
            echo
            echo "This branch is rebuilt from \`$BASE_BRANCH\` on every run. Commits pushed to it are overwritten."
          } > "$RUNNER_TEMP/pr-body.md"

          existing="$(gh pr list --head "$UPDATE_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --head "$UPDATE_BRANCH" --base "$BASE_BRANCH" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
